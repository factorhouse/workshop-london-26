services:
  # consumer - scale to 3 instances
  consumer:
    image: factorhouse/consumer
    build: .
    command: [ "python", "consumer.py" ]
    networks:
      - factorhouse
    profiles:
      - consumer
    deploy:
      replicas: 3
    environment:
      BOOTSTRAP_SERVERS: "kafka-1:19092"
      TOPIC: "orders"
      GROUP_ID: "orders-fulfillment"
      PYTHONUNBUFFERED: 1
  producer:
    image: factorhouse/producer
    build: .
    command: [ "python", "producer.py" ]
    networks:
      - factorhouse
    profiles:
      - producer
    environment:
      BOOTSTRAP_SERVERS: "kafka-1:19092"
      TOPIC: "orders"
      POISON_COUNT: 1000
      PYTHONUNBUFFERED: 1

networks:
  factorhouse:
    external: ${USE_EXT:-true}
    name: factorhouse
