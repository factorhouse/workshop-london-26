services:
  consumer:
    image: python:3.12-slim
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir kafka-python==2.3.1 &&
             python consumer.py"
    networks:
      - factorhouse
    profiles:
      - consumer
      - all
    deploy:
      replicas: 3
    environment:
      BOOTSTRAP_SERVERS: "kafka-1:19092"
      TOPIC: "orders"
      GROUP_ID: "orders-fulfillment"
      PYTHONUNBUFFERED: 1
    volumes:
      - ./consumer.py:/app/consumer.py

  producer:
    image: python:3.12-slim
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir kafka-python==2.3.1 &&
             python producer.py"
    networks:
      - factorhouse
    profiles:
      - producer
      - all
    environment:
      BOOTSTRAP_SERVERS: "kafka-1:19092"
      TOPIC: "orders"
      NUM_PARTITIONS: 3
      POISON_COUNT: 1000
      PYTHONUNBUFFERED: 1
    volumes:
      - ./producer.py:/app/producer.py

networks:
  factorhouse:
    external: ${USE_EXT:-true}
    name: factorhouse
